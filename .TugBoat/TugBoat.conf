# Extra stack folders, one '- "path"' per line (the script folder, ./Stacks, ./stacks and ./Stack are always searched)
stacks_directory:
# Restart with sudo when not run as root (true/false)
require_root: true
# Path of the status JSON file
status_file: ./.TugBoat/tugboat.json
# Stack folders to skip, one '- "name"' per line
ignore_folders:

# Back up a stack before updating it (true/false)
backup: true
# Backup folder ($STACK-NAME = the stack's name)
backup_path: ./.TugBoat/backups/$STACK-NAME
# Backups to keep per stack (count, 0 = all)
backup_retention: 15
# Size from which a backup counts as large (MB, 0 = off)
backup_large_mb: 250
# Backups to keep when the newest one is large (count)
backup_large_retention: 5

# User that runs the docker commands (empty = the user running TugBoat)
docker_user:
# Owner of the files TugBoat writes (user:group, names or IDs)
file_owner: 1000:1000
# Longest wait for containers to become healthy after a start (seconds)
health_wait: 60
# Longest run for a stop, start or update command (seconds, 0 = no limit)
command_timeout: 0
# Stacks handled at the same time (count, 1 = one by one)
parallel_stacks: 4
# Run the error actions in each stack's TugBoat.stack (true/false)
error_actions: true

# Check the registries for new image versions (true/false)
image_check: true
# Time between image and icon checks per stack (minutes)
image_check_interval: 60
# Longest wait for a registry to answer (seconds)
registry_timeout: 10
# After an update, delete: old = the stack's previous images, all = every unused image (docker image prune -a), off = nothing
image_prune: all

# Find logos for stacks and images (true/false)
icons: true
# Time between downloads of the icon index (days)
icon_index_days: 7

# live = the tugboat-live service updates the status file on every container change, no cron job; cron = a cron job (also used when there is no systemd)
healthcheck_mode: live
# Time between full health checks (minutes; cron mode: 1-59 or whole hours)
healthcheck_interval: 1
# Live mode: events = react to Docker events, interval = ask Docker every live_interval
live_mode: events
# Time between checks when live_mode is interval (seconds, 2 or more)
live_interval: 10
# Let TugBoat add, update and remove its cron job (true/false)
manage_cron: true
# Install missing Docker, Compose plugin and cron with apt, dnf or pacman (true/false)
install_dependencies: true

# Look for new TugBoat releases (true/false)
update_check: true
# Time between checks for a new TugBoat release (seconds)
update_check_seconds: 1800
# Install new TugBoat releases by itself (true/false)
auto_update: true
